<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Immediately unregister all Service Workers and clear CacheStorage in Capacitor WebView
      (() => {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var registration of registrations) {
                registration.unregister();
              }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var name of names) {
                caches.delete(name);
              }
            });
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Suppress benign Vite HMR WebSocket notices in cloud preview where HMR is disabled
      (() => {
        const isViteWsNotice = (msg) => {
          if (!msg) return false;
          const str = typeof msg === 'string' ? msg : String(msg?.message || msg?.stack || msg);
          return (
            str.includes('WebSocket closed without opened') ||
            str.includes('[vite] Error: WebSocket') ||
            str.includes('failed to connect to websocket')
          );
        };
        const origConsoleError = console.error;
        console.error = function (...args) {
          if (args.some((arg) => isViteWsNotice(arg))) return;
          origConsoleError.apply(console, args);
        };
        window.addEventListener(
          'error',
          (event) => {
            if (isViteWsNotice(event.message) || isViteWsNotice(event.error)) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          (event) => {
            if (isViteWsNotice(event.reason)) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
    <script>
      (() => {
        try {
          var raw = window.localStorage.getItem('md-visitor-design');
          var parsed = raw ? JSON.parse(raw) : null;
          var theme = (parsed && parsed.theme) || 'default';
          var surface = (parsed && parsed.surfaceStyle) || 'aero-glass';
          var darkThemes = [
            'twilight-lagoon',
            'metro-eclipse-dark',
            'metro-ipod-electric',
            'y2k-phosphor-grid',
          ];
          var prefersDark =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.setAttribute('data-surface', surface);
          if (darkThemes.indexOf(theme) !== -1 || (theme === 'default' && prefersDark)) {
            root.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'default');
          document.documentElement.setAttribute('data-surface', 'aero-glass');
        }
      })();
    </script>
    <title>MY DIARIES DASHBOARD</title>
    <meta name="description" content="Personal Frutiger Aero 2026 multimedia diary, event timeline, and scheduled dashboard." />
    <meta property="og:title" content="MY DIARIES DASHBOARD" />

      rel="stylesheet"

    <style>
      #md-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f8fafc;
        color: #0f172a;
        font-family: "Plus Jakarta Sans", "DM Sans", ui-sans-serif, system-ui, sans-serif;
        opacity: 1;
        transition: opacity 280ms cubic-bezier(0.22, 1, 0.36, 1), visibility 280ms ease;
      }
      html.dark #md-boot-splash {
        background: #0b141d;
        color: #f1f5f9;
      }
      #md-boot-splash.md-splash-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .md-splash-logo-wrap {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: auto;
        min-width: 88px;
        height: auto;
        padding: 8px 16px;
        border: none;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        overflow: visible;
      }
      .md-splash-logo-img {
        width: 76px;
        height: 64px;
        padding: 4px 10px;
        box-sizing: border-box;
        display: block;
        object-fit: contain;
        object-position: center;
        background: transparent;
        box-shadow: none;
        overflow: visible;
      }
      html.dark .md-splash-logo-img {
        filter: invert(1);
      }
      .md-splash-title {
        margin-top: 16px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      .md-splash-track {
        margin-top: 18px;
        width: min(240px, 72vw);
        height: 6px;
        border-radius: 9999px;
        overflow: hidden;
        background: rgba(17, 24, 39, 0.14);
      }
      html.dark .md-splash-track {
        background: rgba(248, 250, 252, 0.18);
      }
      .md-splash-fill {
        width: 14%;
        height: 100%;
        border-radius: 9999px;
        background: #111827;
        transition: width 240ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      html.dark .md-splash-fill {
        background: #f8fafc;
      }
      .md-splash-status {
        margin-top: 10px;
        font-size: 11px;
        font-weight: 500;
        opacity: 0.72;
      }
    </style>
  </head>
  <body>
    <div id="md-boot-splash" role="progressbar" aria-label="Loading MD Dashboard" aria-valuemin="0" aria-valuemax="100" aria-valuenow="14">
      <div class="md-splash-logo-wrap">
        <img src="/favicon.svg" alt="MD" class="md-splash-logo-img" />
      </div>
      <div class="md-splash-title">MY DIARIES DASHBOARD</div>
      <div class="md-splash-track">
        <div id="md-boot-progress-fill" class="md-splash-fill"></div>
      </div>
      <div id="md-boot-splash-status" class="md-splash-status">Loading workspace…</div>
    </div>
    <script>
      (() => {
        var currentPct = 14;
        var dismissed = false;
        var fill = document.getElementById('md-boot-progress-fill');
        var splash = document.getElementById('md-boot-splash');
        var statusEl = document.getElementById('md-boot-splash-status');

        window.__mdSetBootProgress = function (pct, label) {
          if (dismissed || !splash || !fill) return;
          var clamped = Math.max(currentPct, Math.min(100, Math.round(pct)));
          currentPct = clamped;
          fill.style.width = clamped + '%';
          splash.setAttribute('aria-valuenow', String(clamped));
          if (label && statusEl) statusEl.textContent = label;
        };

        window.__mdDismissBootSplash = function () {
          if (dismissed) return;
          dismissed = true;
          clearInterval(bootTicker);
          clearTimeout(hardCapTimer);
          if (!splash) return;
          if (fill) fill.style.width = '100%';
          splash.setAttribute('aria-valuenow', '100');
          splash.style.pointerEvents = 'none';
          requestAnimationFrame(function () {
            splash.classList.add('md-splash-hidden');
            setTimeout(function () {
              if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
            }, 320);
          });
        };

        var bootTicker = setInterval(function () {
          if (dismissed) { clearInterval(bootTicker); return; }
          if (currentPct < 70) {
            window.__mdSetBootProgress(currentPct + (currentPct < 45 ? 10 : 4));
          }
        }, 160);

        // Hard safety cap so splash never blocks navigation or playback if offline/slow
        var hardCapTimer = setTimeout(function () {
          window.__mdDismissBootSplash();
        }, 6500);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
